# Name of the orchestra (DES-1). Replaced by the real name when it is provided.
website.name=PLACEHOLDER_NAME

# The fixed address of the website (HRD-1). Required in production, no default there.
website.public-base-url=${PUBLIC_BASE_URL}
%dev.website.public-base-url=http://localhost:8080
%test.website.public-base-url=http://localhost:8081

# Log level (LGG-6) and the version of this build (HOS-35), both set from the environment
website.log-level=${LOG_LEVEL:INFO}
website.version=${APP_VERSION:dev}

# Logging: structured JSON on standard output (LGG-1)
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# The version is a field of every JSON log line (LGG-2, HOS-35)
quarkus.log.console.json.additional-field."version".value=${APP_VERSION:dev}

