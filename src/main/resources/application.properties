# Name of the orchestra (DES-1). Replaced by the real name when it is provided.
website.name=PLACEHOLDER_NAME

# The fixed address of the website (HRD-1). Required in production, no default there.
website.public-base-url=${PUBLIC_BASE_URL}
%dev.website.public-base-url=http://localhost:8080
%test.website.public-base-url=http://localhost:8081

# Log level (LGG-6) and the version of this build (HOS-35), both set from the environment
website.log-level=${LOG_LEVEL:INFO}
website.version=${APP_VERSION:dev}

# Logging: structured JSON on standard output (LGG-1)
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# The version is a field of every JSON log line (LGG-2, HOS-35)
quarkus.log.console.json.additional-field."version".value=${APP_VERSION:dev}


# HTTP (SEC-20): Cloud Run sends traffic to the port in PORT, and the application only accepts small
# request bodies. Files are uploaded straight to Cloud Storage with signed URLs, not through here.
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=2M
quarkus.http.limits.max-header-size=16K

# Accounts (LOG-18, LOG-19, USR-14). The secrets come from the environment and have no default in
# production. The fake values below are for local work and tests only, and are not secrets.
accounts.password-pepper=${PASSWORD_PEPPER}
accounts.master-email=${MASTER_EMAIL}
accounts.master-password=${MASTER_PASSWORD}
accounts.allow-in-memory-storage=${ACCOUNTS_ALLOW_IN_MEMORY_STORAGE:false}
%dev.accounts.password-pepper=FAKE-NOT-A-SECRET-dev-pepper-0123456789abcdef
%dev.accounts.master-email=master@example.test
%dev.accounts.master-password=FAKE-NOT-A-SECRET-dev-master-password
%dev.accounts.allow-in-memory-storage=true
%dev.accounts.master-setup-on-start=true
%test.accounts.password-pepper=FAKE-NOT-A-SECRET-test-pepper-0123456789abcdef
%test.accounts.master-email=master@example.test
%test.accounts.master-password=FAKE-NOT-A-SECRET-test-master-password
%test.accounts.allow-in-memory-storage=true
%test.accounts.master-setup-on-start=true
