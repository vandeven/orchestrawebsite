<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra website (clickable demo)</title>
<meta name="description" content="Clickable front-end demo of the orchestra website. No server and no real data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237a1f3d'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="demobar" class="demobar" role="region" aria-label="Demo controls"></div>
<header class="site-header">
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">♪</span><span>[Orchestra name]</span></a>
  <button id="menubtn" class="btn sec menubtn" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav" class="nav" aria-label="Main menu"></nav>
</header>
<main id="main" tabindex="-1"></main>
<footer class="site-footer" id="footer"></footer>
<div id="cookie" class="cookie" role="region" aria-label="Cookie notice" hidden>
  <p>This website only uses one cookie, to keep you logged in. There is no tracking, so you do not need to choose.</p>
  <button class="btn" data-action="cookie-ok">OK</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/pages-public.js"></script>
<script src="js/pages-member.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
