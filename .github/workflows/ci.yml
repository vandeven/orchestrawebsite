# Build, test and container checks on every pull request and every push to main
# (plan: Automatic tests, SEC-15, HOS-6). The security scans are in security.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The adapter tests of the Firestore stores run against the real emulator (ARC-6). It is the
      # same image and digest as scripts/firestore-emulator.sh.
      - name: Start the Firestore emulator
        run: bash scripts/firestore-emulator.sh start
      # Enforcer rules, compiler warnings as errors, tests, architecture tests, formatting,
      # SpotBugs with Find Security Bugs and the 80% coverage rule
      - name: Verify
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8086
        run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            target/jacoco-report/
            target/sbom.json
            target/spotbugsXml.xml
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 30

  container:
    name: Container image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the application
        run: ./mvnw -B -ntp -DskipTests package
      - name: Build the image
        env:
          SHA: ${{ github.sha }}
        run: |
          version="${SHA:0:7}-$(date -u +%Y%m%d%H%M)"
          docker build --build-arg "APP_VERSION=$version" -t orchestra-website:ci .
      - name: Container smoke test
        run: bash scripts/container-smoke-test.sh orchestra-website:ci
