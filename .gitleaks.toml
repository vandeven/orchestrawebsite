# Gitleaks configuration (SEC-8). The default rules stay on; only the exceptions below are allowed.
title = "Orchestra website"

[extend]
useDefault = true

[allowlist]
description = "Test marker, not a secret"
# The error tests put this text in an internal error message and then check that it never appears in
# a response. An earlier version of the marker started with "secret-", which looks like a key.
regexes = [
  '''(secret-)?internal-detail-4711''',
  # Fake values for tests, local work and the container smoke test. They all contain this marker.
  '''FAKE-NOT-A-SECRET''',
]
